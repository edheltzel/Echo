name: site

# The public site (site/) builds from site/ plus the published Markdown in docs/,
# README.md, and SECURITY.md. It shares nothing with the Echo runtime checks in
# verify.yml. Cloudflare Pages builds production separately.
on:
  pull_request:
    branches: [dev, master]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/site.yml"
  push:
    branches: [dev, master]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Page "last updated" dates and the sitemap read git history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint:docs
      - run: npm run check:links
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:dist
      - run: npm run check:nimbus
      - run: npm run check:landing
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run check:toc
        env:
          CHROME_PATH: /usr/bin/google-chrome
