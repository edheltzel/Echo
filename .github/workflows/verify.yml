name: verify
on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Link workspace packages
        id: install
        run: bun install --frozen-lockfile
      - name: Unit tests
        id: unit
        run: bun test
      - name: Core smoke
        id: smoke
        run: PORT=8889 tests/smoke-core.sh
      - name: Adapter boundary e2e (isolated daemon, silent)
        id: adapters
        run: ECHO_E2E_PORT=8899 tests/e2e-adapters.sh
      - name: Voice-ask e2e (isolated core + coordinator, no microphone)
        id: converse
        run: ECHO_E2E_PORT=8921 ECHO_E2E_CONVERSE_PORT=8922 tests/e2e-converse.sh
      - name: Pi adapter build
        id: pi
        run: bun build adapters/pi/index.ts --target=bun --external @earendil-works/pi-coding-agent --outdir /tmp/echo-pi-build
      - name: omp adapter build
        id: omp
        run: bun build adapters/omp/index.ts --target=bun --external @oh-my-pi/pi-coding-agent --outdir /tmp/echo-omp-build
      - name: MCP adapter build
        id: mcp
        run: bun build adapters/mcp/server.ts --target=bun --outdir /tmp/echo-mcp-build
      - name: Jcode adapter build
        id: jcode
        run: bun build adapters/jcode/hook.ts --target=bun --outdir /tmp/echo-jcode-build
      - name: Grok adapter build
        id: grok
        run: bun build adapters/grok/hook.ts --target=bun --outdir /tmp/echo-grok-build
      - name: Build Codex adapter
        id: codex
        run: bun build adapters/codex/hook.ts --target=bun --outdir /tmp/echo-codex-build
      - name: Fail closed unless every check ran
        if: always() && !cancelled()
        env:
          INSTALL: ${{ steps.install.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ADAPTERS: ${{ steps.adapters.outcome }}
          CONVERSE: ${{ steps.converse.outcome }}
          PI: ${{ steps.pi.outcome }}
          OMP: ${{ steps.omp.outcome }}
          MCP: ${{ steps.mcp.outcome }}
          JCODE: ${{ steps.jcode.outcome }}
          GROK: ${{ steps.grok.outcome }}
          CODEX: ${{ steps.codex.outcome }}
        run: |
          rc=0
          for pair in install:"$INSTALL" unit:"$UNIT" smoke:"$SMOKE" adapters:"$ADAPTERS" converse:"$CONVERSE" pi:"$PI" omp:"$OMP" mcp:"$MCP" jcode:"$JCODE" grok:"$GROK" codex:"$CODEX"; do
            name=${pair%%:*}
            outcome=${pair#*:}
            if [ "$outcome" != success ]; then
              echo "fail-closed: $name was '${outcome:-unset}' (need success)"
              rc=1
            fi
          done
          exit "$rc"
      - name: Upload smoke log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-core-log
          path: .smoke-core.log
          if-no-files-found: ignore
